aid: sqream-technologies
name: SQream Technologies
description: >-
  SQream Technologies is an Israeli data and analytics company, founded in 2010 in Tel Aviv, that builds
  SQreamDB — a GPU-accelerated, SQL-compliant analytics database for petabyte-scale workloads on NVIDIA
  hardware — alongside AISQream for AI/ML pipelines and Panoply, the no-code cloud data warehouse it
  acquired in 2021. SQream's programmatic surface is a database surface rather than an HTTP one: it is
  reached through first-party client drivers (Python DB-API `pysqream`, JDBC, ODBC, Node.js, .NET,
  SQLAlchemy dialects, Spark and Trino connectors, and an Apache Airflow provider) speaking SQream's own
  wire protocol, plus a set of command-line programs. SQream publishes no public REST/HTTP API, OpenAPI,
  AsyncAPI or GraphQL contract; its customers are enterprises in financial services, telecommunications,
  retail, manufacturing, healthcare and ad-tech running self-managed or cloud-deployed clusters.
