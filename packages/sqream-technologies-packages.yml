source: >-
  Public package registries (pypi.org/pypi/<pkg>/json, registry.npmjs.org, search.maven.org)
  queried unauthenticated on 2026-08-29, cross-referenced against the SQream GitHub organization
  (https://github.com/SQream) and the SQreamDB client-driver matrix at
  https://docs.sqream.com/en/latest/connecting_to_sqream/client_drivers/index.html
note: >-
  SQream has no HTTP API, so these are database CLIENT DRIVERS rather than REST SDKs — they speak
  SQream's own wire protocol over TCP (default port 5000, or 3108 via the load balancer). Registry
  currency is the only provider-published decay signal available here, and it is uneven: the Python
  DB-API driver is current (2025-07-17) while the Node.js connector has not shipped since 2022-02-08
  and the SQream Blue (cloud) family stalled in 2024. Driver versions listed in the docs matrix do not
  always match the registry — the docs table advertises JDBC 6.6 while Maven Central's newest
  com.sqream:sqream-jdbc is 6.0.1, because the ODBC/JDBC/.NET/Spark builds are also distributed as
  downloads from a customer downloads page that this pipeline cannot read anonymously.
